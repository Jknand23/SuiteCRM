version: '3.8'

services:
  # SuiteCRM Application
  suitecrm:
    build: .
    container_name: suitecrm_app
    ports:
      - "8080:80"
    volumes:
      - ./upload:/var/www/html/upload
      - ./custom:/var/www/html/custom
      - ./cache:/var/www/html/cache
      - ./lib:/var/www/html/lib
      - ./include:/var/www/html/include
      - ./themes:/var/www/html/themes
      - ./modules:/var/www/html/modules
      - ./Api:/var/www/html/Api
      - ./config.php:/var/www/html/config.php
      - ./config_override.php:/var/www/html/config_override.php
      - ./docker-entrypoint-updated.sh:/docker-entrypoint.sh:ro
      # Testing infrastructure
      - ./tests:/var/www/html/tests
      - ./vendor:/var/www/html/vendor
      - ./composer.json:/var/www/html/composer.json:ro
      - ./codeception.dist.yml:/var/www/html/codeception.dist.yml:ro
      # Quality tool configuration files
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./rector.php:/var/www/html/rector.php:ro
      - ./validate-new-components.php:/var/www/html/validate-new-components.php:ro
      - ./test-feature-4-step-3.php:/var/www/html/test-feature-4-step-3.php:ro
      - ./.php_cs.dist:/var/www/html/.php_cs.dist:ro
    env_file:
      - .env.docker
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=${MYSQL_DATABASE}
      - DATABASE_USER=${MYSQL_USER}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - SITE_URL=${SUITECRM_SITE_URL}
    entrypoint: /docker-entrypoint.sh
    depends_on:
      - mysql
      - elasticsearch
      - redis
    networks:
      - suitecrm_network

  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: suitecrm_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=suitecrm
      - MYSQL_USER=suitecrm
      - MYSQL_PASSWORD=suitecrm_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/.my.cnf:/etc/mysql/conf.d/.my.cnf:ro
    ports:
      - "3306:3306"
    networks:
      - suitecrm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Elasticsearch for search
  elasticsearch:
    image: elasticsearch:7.17.9
    container_name: suitecrm_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - suitecrm_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching
  redis:
    image: redis:6-alpine
    container_name: suitecrm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - suitecrm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: suitecrm_phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root_password
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - suitecrm_network

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:

networks:
  suitecrm_network:
    driver: bridge 